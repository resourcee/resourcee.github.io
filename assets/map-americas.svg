<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="width:100%">
  <style>
    .land { fill: #dce4f0; stroke: #b0c2da; stroke-width: 1; }
    .city-ring { fill: none; stroke: #152040; stroke-width: 1.5; opacity: 0; animation: ripple 2.5s infinite; }
    .city-dot  { fill: #152040; }
    @keyframes ripple {
      0%   { r: 4px;  opacity: .8; }
      100% { r: 12px; opacity: 0; }
    }
  </style>
