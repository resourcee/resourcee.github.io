<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
  /* Inter is vendored under tools/fonts so card rendering never depends on the
     network — a missing webfont would silently change every card's metrics. */
  @font-face { font-family: 'Inter'; font-weight: 600; font-display: block; src: url('fonts/Inter-600.ttf') format('truetype'); }
  @font-face { font-family: 'Inter'; font-weight: 700; font-display: block; src: url('fonts/Inter-700.ttf') format('truetype'); }
  @font-face { font-family: 'Inter'; font-weight: 800; font-display: block; src: url('fonts/Inter-800.ttf') format('truetype'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: linear-gradient(140deg, #152040 0%, #12275a 40%, #1e3d82 72%, #1C4ED8 100%);
    color: #fff;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* Decorative map + glow. The outline is the same LATAM path the home page
     renders (index.html, .latam-map__svg) — it is already drawn in periwinkle
     for a navy ground, so it needs no recolouring here. */
  .map {
    position: absolute; right: 56px; top: 50%;
    transform: translateY(-50%);
    width: 330px; height: 330px;
  }
  .glow {
    position: absolute; width: 720px; height: 720px; border-radius: 50%;
    right: -240px; bottom: -320px;
    background: radial-gradient(circle, rgba(66,120,255,.55) 0%, rgba(66,120,255,0) 68%);
  }

  /* Article artwork. Blog posts swap the map for the post's own illustration.
     The source SVGs are drawn on a light ground, so they are mounted as a panel
     rather than laid straight onto the navy. */
  .art {
    position: absolute; right: 60px; top: 50%;
    transform: translateY(-50%);
    width: 380px; height: 266px;
    border-radius: 18px;
    overflow: hidden;
    background: #EEF2FF;
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: 0 18px 48px rgba(5,12,32,.42);
  }
  /* The source art is a wide banner with generous empty margins — at card size
     the motif would read as a speck, so crop in on it. */
  .art img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transform: scale(1.38);
  }

  .card {
    position: relative; z-index: 2;
    height: 100%;
    padding: 68px 76px 60px;
    display: flex; flex-direction: column;
  }

  /* Brand lockup */
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand__chip {
    width: 72px; height: 72px; border-radius: 18px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 28px rgba(0,0,0,.22);
  }
  .brand__chip img { width: 44px; height: auto; display: block; }
  .brand__name {
    font-size: 34px; font-weight: 800; letter-spacing: -.8px; color: #fff;
  }

  /* Body */
  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .kicker {
    font-size: 16px; font-weight: 700; letter-spacing: 2.6px;
    text-transform: uppercase; color: #8FB0FF;
    margin-bottom: 22px;
  }
  h1 {
    font-weight: 800;
    letter-spacing: -1.8px;
    line-height: 1.1;
    color: #fff;
    /* The map occupies x >= 814; this keeps the headline clear of it. */
    max-width: 720px;
  }
  /* The artwork panel starts further left than the map (x >= 764), so the
     headline column narrows to keep a clear gutter between the two. */
  body.has-art h1 { max-width: 630px; }
  h1.size-l  { font-size: 64px; }
  h1.size-m  { font-size: 56px; }
  h1.size-s  { font-size: 48px; letter-spacing: -1.4px; }
  h1.size-xs { font-size: 42px; letter-spacing: -1.1px; }
  h1.size-xxs { font-size: 37px; letter-spacing: -.9px; }

  /* Footer */
  .foot {
    display: flex; align-items: center; gap: 20px;
    font-size: 20px; font-weight: 600; color: #C4CEEE;
  }
  .foot__rule { width: 64px; height: 4px; border-radius: 4px; background: #4F84FF; }
  .foot__dot { color: #55699e; }
</style>
</head>
<body>

    <!-- Sourcing hubs, on the same coordinates the home page marks -->
    <polyline points="75,53 149,95 141,142 220,177 195,205" fill="none"
              stroke="rgba(196,206,238,0.22)" stroke-width="0.9" stroke-dasharray="2,3"/>

    <circle cx="195" cy="205" r="2.8" fill="#fff"    opacity="0.8"/>
  </svg>
  <div class="art" id="art" hidden><img id="art-img" src="" alt=""/></div>
  <div class="glow"></div>

  <div class="card">
    <div class="brand">
      <div class="brand__chip"><img src="../assets/logo.png" alt=""/></div>
      <div class="brand__name">Resourcee</div>
    </div>

    <div class="body">
      <div class="kicker" id="kicker"></div>
      <h1 id="title"></h1>
    </div>

    <div class="foot">
      <span class="foot__rule"></span>
      <span>resourcee.co</span>
      <span class="foot__dot">&bull;</span>
      <span>San Diego &amp; Medell&iacute;n</span>
    </div>
  </div>

<script>
  const p = new URLSearchParams(location.search);
  const title = p.get('title') || 'Elite South American Engineering Talent for US Teams';
  const kicker = p.get('kicker') || 'Nearshore Talent Partner';
  const image = p.get('image');

  document.getElementById('title').textContent = title;
  document.getElementById('kicker').textContent = kicker;

  // Blog posts pass their own illustration; everything else keeps the map.
  if (image) {
    document.getElementById('art-img').src = image;
    document.getElementById('art').hidden = false;
    document.querySelector('.map').remove();
    document.body.classList.add('has-art');
  }

  // Pick a type size that keeps the headline inside its box without clipping.
  // Must wait for Inter, or the measurement uses fallback font metrics.
  document.fonts.ready.then(() => {
    const h1 = document.getElementById('title');
    const steps = ['size-l', 'size-m', 'size-s', 'size-xs', 'size-xxs'];
    const maxHeight = 300;
    for (const cls of steps) {
      h1.className = cls;
      if (h1.getBoundingClientRect().height <= maxHeight) break;
    }
    document.documentElement.dataset.ready = '1';
  });
</script>
</body>
</html>
